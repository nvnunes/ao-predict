simulation:
  name: Tiptop
  config_path: sample_tiptop.ini

setup:
  ee_apertures: {value: [50.0, 100.0], unit: mas}
  ngs_magnitude_zeropoint: {value: 3.0e10, unit: photon / s}

options:
  broadcast:
    zenith_angle: {value: 20.0, unit: deg}
  table:
    columns:
      - wavelength
    units:
      wavelength: um
    rows:
      - [1.654]
      - [2.179]
